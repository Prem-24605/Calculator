<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Friendly Calculator</title>

<style>
    body {
        background: #eef2f7;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: Arial, sans-serif;
    }

    .calculator {
        background: #ffffff;
        padding: 20px;
        border-radius: 12px;
        width: 300px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }

    .display {
        width: 100%;
        height: 60px;
        font-size: 24px;
        text-align: right;
        padding: 10px;
        border-radius: 8px;
        border: 2px solid #ddd;
        margin-bottom: 15px;
    }

    .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
    }

    button {
        padding: 18px;
        font-size: 18px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        transform: scale(1.05);
    }

    .num {
        background: #f1f3f6;
    }

    .op {
        background: #1f3c88;
        color: white;
    }

    .equal {
        background: #28a745;
        color: white;
        grid-column: span 2;
    }

    .clear {
        background: #dc3545;
        color: white;
    }

    .back {
        background: #ffc107;
    }
</style>
</head>
<body>

<div class="calculator">
    <input type="text" id="display" class="display" readonly>

    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button class="back" onclick="backspace()">⌫</button>
        <button class="op" onclick="append('/')">÷</button>
        <button class="op" onclick="append('*')">×</button>

        <button class="num" onclick="append('7')">7</button>
        <button class="num" onclick="append('8')">8</button>
        <button class="num" onclick="append('9')">9</button>
        <button class="op" onclick="append('-')">−</button>

        <button class="num" onclick="append('4')">4</button>
        <button class="num" onclick="append('5')">5</button>
        <button class="num" onclick="append('6')">6</button>
        <button class="op" onclick="append('+')">+</button>

        <button class="num" onclick="append('1')">1</button>
        <button class="num" onclick="append('2')">2</button>
        <button class="num" onclick="append('3')">3</button>
        <button class="num" onclick="append('.')">.</button>

        <button class="num" onclick="append('0')">0</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
    const display = document.getElementById("display");

    function append(value) {
        display.value += value;
    }

    function clearDisplay() {
        display.value = "";
    }

    function backspace() {
        display.value = display.value.slice(0, -1);
    }

    function calculate() {
        try {
            display.value = Function("return " + display.value)();
        } catch {
            display.value = "Error";
        }
    }
</script>

</body>
</html>
